x-ingest-env: &ingest-env
  OPENALEPH_DB_URI: postgresql://ingest:ingest@postgres/ingest
  FTM_FRAGMENTS_URI: postgresql://ingest:ingest@postgres/ingest
  LAKEHOUSE_JOURNAL_URI: postgresql://ingest:ingest@postgres/ingest
  TIKA_SERVER_ENDPOINT: http://tika:9998
  TIKA_CLIENT_ONLY: 1
  LOG_FORMAT: TEXT # TEXT or JSON
  PYTHONWARNINGS: "ignore"
  TYPER_STANDARD_TRACEBACK: True

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DATABASE: ingest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ingest -d ingest"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "3600", "10"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  tika:
    # not `latest`, that is Tika 4.x.
    image: apache/tika:3.3.1.0
    # appended to the image entrypoint `java ... TikaServerCli -h 0.0.0.0`
    command: ["-c", "/tika-config.xml"]
    configs:
      - source: tika-config
        target: /tika-config.xml
    # the image has neither curl nor wget
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 2s
      timeout: 5s
      retries: 30

  ingest-file:
    build:
      context: .
      target: runtime
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      - /data:mode=777
    environment:
      <<: *ingest-env
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./data:/ingestors/data"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy

  test-ingest-file:
    build:
      context: .
      target: test
    image: test-ingest-file
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      # LAKEHOUSE_URI points here, so lakehouse output is ephemeral per run
      - /data:mode=777
    environment:
      <<: *ingest-env
      DEBUG: 1
      PYTHONDEVMODE: 1
      PYTHONTRACEMALLOC: 1
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./tests:/ingestors/tests"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy

configs:
  tika-config:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <properties>
        <server>
          <params>
            <taskTimeoutMillis>300000</taskTimeoutMillis>
            <forkedJvmArgs>
              <arg>-Xmx2g</arg>
            </forkedJvmArgs>
          </params>
        </server>
      </properties>
