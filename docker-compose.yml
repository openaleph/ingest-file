services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DATABASE: ingest

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "3600", "10"]

  ingest-file:
    build:
      dockerfile: Dockerfile
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      - /data:mode=777
    environment:
      OPENALEPH_DB_URI: postgresql://ingest:ingest@postgres/ingest
      FTM_STORE_URI: postgresql://ingest:ingest@postgres/ingest
      LOG_FORMAT: TEXT # TEXT or JSON
    entrypoint: ["/bin/sh", "-c", "echo 'opal-procrastinate init-db' && exec \"$@\"", "--"]
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./data:/ingestors/data"
      - "./requirements.txt:/ingestors/requirements.txt"
      - "./setup.py:/ingestors/setup.py"
    depends_on:
      - postgres
      - redis

  test-ingest-file:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: test-ingest-file
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      - /data:mode=777
    environment:
      OPENALEPH_DB_URI: postgresql://ingest:ingest@postgres/ingest
      FTM_STORE_URI: postgresql://ingest:ingest@postgres/ingest
      LOG_FORMAT: TEXT # TEXT or JSON
      DEBUG: 1
    entrypoint: ["/bin/sh", "-c", "echo 'opal-procrastinate init-db' && exec \"$@\"", "--"]
    volumes:
      - "./tests:/ingestors/tests"
      - "./data:/ingestors/data"
    depends_on:
      - postgres
      - redis
