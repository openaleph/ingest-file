x-ingest-env: &ingest-env
  OPENALEPH_DB_URI: postgresql://ingest:ingest@postgres/ingest
  FTM_FRAGMENTS_URI: postgresql://ingest:ingest@postgres/ingest
  LAKEHOUSE_JOURNAL_URI: postgresql://ingest:ingest@postgres/ingest
  LOG_FORMAT: TEXT # TEXT or JSON
  PYTHONWARNINGS: "ignore"
  TYPER_STANDARD_TRACEBACK: True

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DATABASE: ingest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ingest -d ingest"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "3600", "10"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  ingest-file:
    build:
      context: .
      target: runtime
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      - /data:mode=777
    environment:
      <<: *ingest-env
      # convert office documents through the unoserver services below instead
      # of spawning libreoffice per document
      # INGESTORS_UNOSERVER_URI: http://unoserver-lb:2003
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./data:/ingestors/data"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # optional persistent libreoffice listener. It converts one document at a
  # time, so scale it to the number of concurrent workers.
  unoserver:
    image: ghcr.io/openaleph/ingest-file-unoserver:main
    profiles:
      - unoserver
    # unoserver exits with status 0 after a conversion timeout, so `on-failure`
    # would leave it down
    restart: unless-stopped
    tmpfs:
      - /tmp:mode=777

  # hands each conversion to an idle unoserver replica and queues while all are
  # busy.
  unoserver-lb:
    image: haproxy:lts-alpine
    profiles:
      - unoserver
    restart: unless-stopped
    configs:
      - source: unoserver-lb
        target: /usr/local/etc/haproxy/haproxy.cfg

  test-ingest-file:
    build:
      context: .
      target: test
    image: test-ingest-file
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      # LAKEHOUSE_URI points here, so lakehouse output is ephemeral per run
      - /data:mode=777
    environment:
      <<: *ingest-env
      DEBUG: 1
      PYTHONDEVMODE: 1
      PYTHONTRACEMALLOC: 1
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./tests:/ingestors/tests"
    # both backends talk to postgres: the fragments store, the lakehouse journal
    # and, either way, the tags cache. `run` brings it up for us, so `make
    # test-*` works without a preceding `make services` (CI relies on that).
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

configs:
  unoserver-lb:
    content: |
      defaults
        mode tcp
        timeout connect 5s
        # a conversion may take up to the worker's INGESTORS_CONVERT_TIMEOUT
        timeout client 300s
        timeout server 300s
        # how long a conversion waits for an idle replica
        timeout queue 60s

      resolvers docker
        nameserver dns 127.0.0.11:53

      listen unoserver
        bind :2003
        balance leastconn
        # a slot for each address docker's dns returns for `unoserver` (up to
        # 16), each taking one conversion at a time
        server-template uno 1-16 unoserver:2003 resolvers docker init-addr none maxconn 1
