x-ingest-env: &ingest-env
  OPENALEPH_DB_URI: postgresql://ingest:ingest@postgres/ingest
  FTM_FRAGMENTS_URI: postgresql://ingest:ingest@postgres/ingest
  # the lakehouse journal defaults to an in-memory sqlite, which is per-process
  # and so invisible to any other reader. the driver has to be spelled out: the
  # journal hands the uri to `create_engine` as-is and bare `postgresql://`
  # resolves to psycopg2, which we don't ship (only psycopg 3)
  LAKEHOUSE_JOURNAL_URI: postgresql+psycopg://ingest:ingest@postgres/ingest
  # use the `tika` service instead of starting the jar baked into the image.
  # tika-python reads these on import; any non-empty TIKA_CLIENT_ONLY enables
  # client-only mode, "0" too – unset it to fall back to the inline server
  TIKA_SERVER_ENDPOINT: http://tika:9998
  TIKA_CLIENT_ONLY: 1
  LOG_FORMAT: TEXT # TEXT or JSON
  PYTHONWARNINGS: "ignore"
  TYPER_STANDARD_TRACEBACK: True

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DATABASE: ingest
    # over tcp, not the socket: during initdb the entrypoint runs a temporary
    # server that only listens on the socket, so a socket check reports ready
    # before the database actually accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ingest -d ingest"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "3600", "10"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  tika:
    # not `latest`, that is Tika 4.x. 3.3.1.0 is the newest 3.x image, one patch
    # behind the jar the Dockerfile bakes in (no 3.3.2 image is published)
    image: apache/tika:3.3.1.0
    # appended to the image entrypoint `java ... TikaServerCli -h 0.0.0.0`
    command: ["-c", "/tika-config.xml"]
    configs:
      - source: tika-config
        target: /tika-config.xml
    # the image has neither curl nor wget
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 2s
      timeout: 5s
      retries: 30

  ingest-file:
    build:
      context: .
      target: runtime
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      - /data:mode=777
    environment:
      <<: *ingest-env
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./data:/ingestors/data"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy

  test-ingest-file:
    build:
      context: .
      target: test
    image: test-ingest-file
    hostname: ingest
    tmpfs:
      - /tmp:mode=777
      # LAKEHOUSE_URI points here, so lakehouse output is ephemeral per run
      - /data:mode=777
    environment:
      <<: *ingest-env
      DEBUG: 1
      PYTHONDEVMODE: 1
      PYTHONTRACEMALLOC: 1
    volumes:
      - "./ingestors:/ingestors/ingestors"
      - "./tests:/ingestors/tests"
    # both backends talk to postgres: the fragments store, the lakehouse journal
    # and, either way, the tags cache. `run` brings it up for us, so `make
    # test-*` works without a preceding `make services` (CI relies on that).
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy

configs:
  # Tika parses in one forked JVM, and a watchdog restarts it when a parse
  # exceeds taskTimeoutMillis or runs out of memory, failing every request in
  # flight. Concurrent parses share the heap: size -Xmx for the sum of the
  # `procrastinate worker --concurrency` of all ingest workers
  tika-config:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <properties>
        <server>
          <params>
            <taskTimeoutMillis>300000</taskTimeoutMillis>
            <forkedJvmArgs>
              <arg>-Xmx2g</arg>
            </forkedJvmArgs>
          </params>
        </server>
      </properties>
